		<script>
			(function () {
				try {
					const darkMode = localStorage.getItem("darkMode");
					const path = window.location.pathname;
					const isLandingPage = path === "/";
					const isBlogPage = path === "/blog" || path.startsWith("/blogs/");

					// Check system preference if no explicit theme is set
					const prefersDarkMode =
						window.matchMedia &&
						window.matchMedia("(prefers-color-scheme: dark)").matches;
					const shouldUseDarkMode =
						darkMode === null ? prefersDarkMode : darkMode === "true";

					if (isBlogPage) {
						// Force light mode on blog pages only
						document.documentElement.style.background = "#FFFFFF";
						document.documentElement.style.color = "initial";
						document.documentElement.removeAttribute("data-theme");
						document.documentElement.classList.remove("dark-mode");
						document.documentElement.setAttribute("data-landing", "true");
						// Force white status bar on blog pages
						document
							.querySelector('meta[name="theme-color"]')
							.setAttribute("content", "#FFFFFF");
					} else if (shouldUseDarkMode) {
						// Apply dark mode
						document.documentElement.style.background = "#141212";
						document.documentElement.style.color = "#FCF6F5";
						document.documentElement.setAttribute("data-theme", "dark");
						document.documentElement.classList.add("dark-mode");
						document.documentElement.removeAttribute("data-landing");
						// Update theme-color for dark mode
						document
							.querySelector('meta[name="theme-color"]')
							.setAttribute("content", "#141212");
						// Update color-scheme for dark mode
						document
							.querySelector('meta[name="color-scheme"]')
							.setAttribute("content", "dark");
					} else {
						// Apply light mode
						document.documentElement.style.background = "#FFFFFF";
						document.documentElement.style.color = "initial";
						document.documentElement.removeAttribute("data-theme");
						document.documentElement.classList.remove("dark-mode");
						document.documentElement.removeAttribute("data-landing");
						// Update theme-color for light mode
						document
							.querySelector('meta[name="theme-color"]')
							.setAttribute("content", "#FFFFFF");
						// Update color-scheme for light mode
						document
							.querySelector('meta[name="color-scheme"]')
							.setAttribute("content", "light");
					}
				} catch (e) {}
			})();
		</script>
